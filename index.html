<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Pass D, prototype local pour les vétérans du CS Veymerange">
  <title>Pass D — Vétérans</title>
  <style>
    :root{--ink:#11291d;--muted:#65766b;--line:#dce7df;--paper:#f4f7f3;--card:#fff;--green:#08713d;--deep:#064d2a;--soft:#dff5e7;--red:#af3933;--redsoft:#ffe8e6;--amber:#986000;--ambersoft:#fff1d8;--blue:#1d629f;--bluesoft:#e6f1fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);padding-bottom:84px}.shell{width:min(100%,1180px);margin:auto}
    button,select{font:inherit}button{cursor:pointer}.test{padding:.58rem 1rem;background:#15271d;color:#e6f7ea;text-align:center;font-size:.78rem;letter-spacing:.02em}.test b{color:#aaf5c1}
    header{position:relative;overflow:hidden;background:linear-gradient(125deg,#075b32,#08713d 55%,#0d8d53);color:#fff;padding:1.15rem 1rem 3.9rem}header:after{content:"";position:absolute;width:34rem;height:34rem;border:1px solid #ffffff28;border-radius:50%;right:-20rem;top:-25rem;box-shadow:0 0 0 35px #ffffff0b,0 0 0 72px #ffffff09}.top,.hero{position:relative;z-index:1}.top{display:flex;justify-content:space-between;gap:.7rem;align-items:center}.club{margin:0;color:#c3eecf;font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.account{border:1px solid #ffffff45;border-radius:99px;padding:.45rem .7rem;background:#04351f55;color:#fff;font-size:.78rem;font-weight:800}.hero{margin-top:1.55rem}.hero h1{margin:0;font-size:clamp(2.4rem,8vw,3.8rem);line-height:.9;letter-spacing:-.07em}.hero p{margin:.65rem 0 0;color:#d7f3df;font-size:.98rem}
    .roles{position:relative;z-index:2;display:flex;gap:.35rem;width:min(calc(100% - 2rem),520px);margin:-1.55rem auto 0;padding:.34rem;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 14px 35px #13301f14}.roles button{flex:1;border:0;border-radius:10px;padding:.65rem .35rem;color:var(--muted);background:transparent;font-size:.84rem;font-weight:800}.roles .active{background:var(--soft);color:var(--deep)}
    main{padding:1.2rem 1rem 1rem}.grid{display:grid;gap:1rem}.head{display:flex;align-items:end;justify-content:space-between;gap:.7rem;margin:1.35rem 0 .7rem}.head h2{margin:0;font-size:1.04rem;letter-spacing:-.025em}.head p,.help{margin:.15rem 0 0;color:var(--muted);font-size:.83rem;line-height:1.45}.card{border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 4px 18px #0f351e09}.pad{padding:1rem}.notice{display:grid;grid-template-columns:auto 1fr;gap:.75rem;padding:1rem;border:1px solid #eddda9;border-radius:16px;background:#fff9e7}.notice i{width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:11px;background:#ffe9a9;font-style:normal;font-size:1.1rem}.eyebrow{color:var(--muted);font-size:.71rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.notice h2{margin:.1rem 0 .3rem;font-size:1rem}.notice p{margin:0;color:#4e4d3d;font-size:.88rem;line-height:1.48}
    .answer{position:relative;overflow:hidden;padding:1rem;border-radius:18px;background:linear-gradient(135deg,#075d34,#0d8d52);color:#fff;box-shadow:0 14px 30px #08713d38}.answer:after{content:"";position:absolute;width:10rem;height:10rem;border:18px solid #ffffff1c;border-radius:50%;right:-2rem;bottom:-5rem}.answer>*{position:relative;z-index:1}.answer .eyebrow{color:#c0f3cf}.answer h2{margin:.3rem 0;font-size:1.3rem;letter-spacing:-.035em}.answer p{margin:0;color:#d7f3e0;font-size:.88rem}.meta{display:flex;flex-wrap:wrap;gap:.4rem .7rem;margin:.8rem 0;font-size:.82rem}.answer-actions{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}.answer-actions button,.primary,.secondary{min-height:45px;border-radius:11px;font-weight:800}.answer-actions button{border:1px solid #fff4;color:#fff;background:#fff2}.answer-actions .present{border-color:#fff;background:#fff;color:var(--deep)}.answer-actions .absent{background:#681a15aa}.selected{outline:3px solid #ffffff70}.primary{border:0;padding:0 .9rem;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);padding:0 .9rem;background:#fff;color:var(--ink)}.danger{border-color:#efc7c4;background:#fffafa;color:var(--red)}.text{border:0;padding:.3rem;color:var(--green);background:transparent;font-size:.84rem;font-weight:800}
    .events,.people{display:grid;gap:.62rem}.event{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center;width:100%;padding:.84rem;text-align:left}.date{width:3rem;overflow:hidden;border-radius:11px;background:var(--soft);color:var(--deep);text-align:center}.date b{display:block;padding-top:.34rem;font-size:1.1rem;line-height:1}.date span{display:block;padding:.25rem .1rem .35rem;font-size:.65rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.event h3{margin:0;font-size:.93rem}.event p{margin:.2rem 0 0;color:var(--muted);font-size:.77rem}.arrow{color:var(--muted);font-size:1.3rem}
    .status{display:inline-flex;align-items:center;gap:.27rem;width:fit-content;padding:.31rem .52rem;border-radius:99px;font-size:.71rem;font-weight:800}.present-status{background:var(--soft);color:#075e32}.absent-status{background:var(--redsoft);color:#992e29}.pending-status{background:var(--ambersoft);color:var(--amber)}.published{background:var(--bluesoft);color:var(--blue)}
    .account-card{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.95rem}.account-card h2{margin:.15rem 0 0;font-size:1rem}.picker,.admin-role{border:1px solid var(--line);border-radius:10px;padding:.55rem .45rem;background:#fff;color:var(--ink);font-size:.78rem}.picker{max-width:11rem}.profile{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-top:.9rem}.field{padding:.7rem;border:1px solid var(--line);border-radius:12px}.field span{display:block;color:var(--muted);font-size:.69rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.field b{display:block;margin-top:.18rem;font-size:.83rem;overflow-wrap:anywhere}
    .tabs{display:flex;gap:.35rem;overflow:auto;padding:.25rem;border:1px solid var(--line);border-radius:13px;background:#fff;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;border:0;border-radius:9px;padding:.6rem .75rem;background:transparent;color:var(--muted);font-size:.81rem;font-weight:800}.tabs .active{background:var(--soft);color:var(--deep)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}.metric{padding:.75rem .4rem;border:1px solid var(--line);border-radius:13px;text-align:center}.metric b{display:block;font-size:1.3rem;letter-spacing:-.05em}.metric span{color:var(--muted);font-size:.69rem;font-weight:700}
    .detail{padding:1rem}.title{display:flex;justify-content:space-between;align-items:start;gap:.7rem}.title h2{margin:.2rem 0 0;font-size:1.22rem;letter-spacing:-.04em}.block{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}.block h3{margin:0 0 .65rem;font-size:.86rem}.person{display:flex;align-items:center;gap:.6rem;min-height:43px}.avatar{display:grid;place-items:center;flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;background:#176a45;color:#fff;font-size:.7rem;font-weight:800}.person-main{min-width:0;flex:1}.person-main b{display:block;font-size:.86rem}.person-main span{color:var(--muted);font-size:.73rem}.toggle{width:2rem;height:2rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-weight:900}.toggle.on{border-color:var(--green);background:var(--green);color:#fff}.actions{display:grid;gap:.55rem;margin-top:1rem}.empty{padding:1.4rem 1rem;border:1px dashed #c8d6cc;border-radius:15px;color:var(--muted);background:#fbfdfb;text-align:center;font-size:.88rem}
    .bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:.45rem .7rem calc(.45rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fffffff0;backdrop-filter:blur(14px)}.bottom div{display:flex;width:min(100%,520px)}.nav{flex:1;border:0;padding:.28rem .2rem;background:transparent;color:var(--muted);font-size:.68rem;font-weight:800}.nav span{display:block;margin-bottom:.1rem;font-size:1.1rem}.nav.active{color:var(--deep)}
    dialog{width:min(calc(100% - 2rem),420px);border:0;border-radius:19px;padding:0;color:var(--ink);box-shadow:0 24px 70px #05201255}dialog::backdrop{background:#051e1190}.dialog{padding:1.2rem}.dialog h2{margin:0;font-size:1.2rem}.dialog p{margin:.4rem 0 1rem;color:var(--muted);font-size:.87rem}.reasons{display:grid;gap:.5rem}.reasons button{padding:.75rem .8rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-align:left;font-weight:700}.dialog-actions{display:flex;gap:.55rem;margin-top:1rem}
    @media(min-width:700px){body{padding-bottom:1rem}header{padding:1.35rem 2rem 4.45rem;border-radius:0 0 26px 26px}main{padding:1.5rem 2rem 2.5rem}.grid{grid-template-columns:minmax(0,1.25fr) minmax(285px,.75fr);align-items:start}.coach-grid{grid-template-columns:minmax(0,1fr) minmax(320px,.85fr)}.actions{grid-template-columns:1fr 1fr}.bottom{position:static;padding:0;border:0;background:transparent;backdrop-filter:none}.bottom div{display:none}}
  </style>
</head>
<body>
  <div class="test"><b>MODE TEST LOCAL</b> — données fictives en mémoire · aucune connexion ni écriture Firebase</div>
  <header><div class="shell"><div class="top"><p class="club">CS Veymerange · Vétérans</p><button class="account" id="profile">Mon compte</button></div><div class="hero"><h1>Pass D</h1><p id="subtitle">L’essentiel de l’équipe, sans détour.</p></div></div></header>
  <div class="roles" aria-label="Rôle de démonstration"><button data-role="joueur">Joueur</button><button data-role="coach">Coach</button><button data-role="admin">Admin</button></div>
  <main class="shell" id="app"></main>
  <nav class="bottom" aria-label="Navigation principale"><div id="nav"></div></nav>
  <dialog id="absence"><div class="dialog"><h2>Motif d’absence</h2><p>Facultatif. Le coach pourra le consulter.</p><div class="reasons"><button data-reason="Blessé">Blessé</button><button data-reason="Indisponible">Indisponible</button><button data-reason="Travail">Travail</button><button data-reason="Autre">Autre</button></div><div class="dialog-actions"><button class="secondary" id="no-reason">Continuer sans motif</button><button class="secondary" id="cancel-reason">Annuler</button></div></div></dialog>
  <script>
    "use strict";
    // Prototype autonome : pas de SDK, pas d'appel réseau, pas de stockage persistant.
    const players=[
      {id:"lucas",first:"Lucas",last:"Martin",phone:"06 11 22 33 44",user:"lucas.m",position:"Gardien",role:"joueur"},
      {id:"hugo",first:"Hugo",last:"Bernard",phone:"06 21 32 43 54",user:"hugo.b",position:"Gardien",role:"joueur"},
      {id:"raphael",first:"Raphaël",last:"Dupont",phone:"06 31 42 53 64",user:"raph57",position:"Défenseur",role:"coach"},
      {id:"julien",first:"Julien",last:"Morel",phone:"06 41 52 63 74",user:"julien.m",position:"Défenseur",role:"joueur"},
      {id:"maxime",first:"Maxime",last:"Leroy",phone:"06 51 62 73 84",user:"max.l",position:"Milieu",role:"joueur"},
      {id:"thomas",first:"Thomas",last:"Petit",phone:"06 61 72 83 94",user:"thomas.p",position:"Milieu",role:"joueur"},
      {id:"kevin",first:"Kevin",last:"Robert",phone:"06 71 82 93 04",user:"kevin.r",position:"Attaquant",role:"joueur"},
      {id:"nicolas",first:"Nicolas",last:"Simon",phone:"06 81 92 03 14",user:"nico.s",position:"Attaquant",role:"admin"}
    ];
    const all=players.map(p=>p.id);
    const events=[
      {id:"russange",type:"match",title:"CS Veymerange · AS Russange",date:"2026-09-13",time:"10:00",meeting:"09:15",place:"Stade municipal de Veymerange",description:"Championnat vétérans · Tenue verte et blanche.",published:false,closed:false,invited:all,responses:{lucas:{status:"present"},hugo:{status:"present"},raphael:{status:"present"},julien:{status:"absent",reason:"Travail"},maxime:{status:"pending"},thomas:{status:"present"},kevin:{status:"pending"},nicolas:{status:"absent",reason:"Indisponible"}},selected:["lucas","raphael","maxime","thomas","kevin"]},
      {id:"jeudi",type:"training",title:"Entraînement du jeudi",date:"2026-09-10",time:"20:00",meeting:"19:50",place:"Stade municipal de Veymerange",description:"Séance collective · Préviens si tu ne peux pas venir.",published:true,closed:false,invited:all,responses:{lucas:{status:"present"},hugo:{status:"present"},raphael:{status:"present"},julien:{status:"absent",reason:"Travail"},maxime:{status:"pending"},thomas:{status:"present"},kevin:{status:"present"},nicolas:{status:"absent",reason:"Blessé"}},selected:[]},
      {id:"tressange",type:"match",title:"US Tressange · CS Veymerange",date:"2026-09-20",time:"15:00",meeting:"14:15",place:"Stade de Tressange",description:"Championnat vétérans · Déplacement.",published:false,closed:false,invited:all,responses:{},selected:[]}
    ];
    const state={role:"joueur",view:"accueil",player:"raphael",event:"russange",absenceEvent:null,info:"Entraînement déplacé à 20h jeudi. Pense à prévenir si tu ne peux pas venir.",profile:false};
    const app=document.querySelector("#app"),dialog=document.querySelector("#absence");
    const person=id=>players.find(p=>p.id===id),event=id=>events.find(e=>e.id===id),name=p=>p.first+" "+p.last,initials=p=>(p.first[0]+p.last[0]).toUpperCase();
    const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    const date=d=>{let x=new Date(d+"T12:00:00");return {n:x.toLocaleDateString("fr-FR",{day:"numeric"}),m:x.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")}};
    const response=(e,id)=>e.responses[id]||{status:"pending"};
    const isCoach=()=>state.role!=="joueur", userEvents=()=>events.filter(e=>e.invited.includes(state.player)&&!e.closed).sort((a,b)=>a.date.localeCompare(b.date));
    const pending=()=>userEvents().find(e=>response(e,state.player).status==="pending");
    function tag(r){let s=r.status||"pending",icon=s==="present"?"✓":s==="absent"?"×":"•",label=s==="present"?"Présent":s==="absent"?"Absent":"Sans réponse";return '<span class="status '+s+'-status">'+icon+" "+label+"</span>"}
    function tile(e){let d=date(e.date);return '<div class="date"><b>'+d.n+"</b><span>"+d.m+"</span></div>"}
    function row(e){return '<button class="card event" data-open="'+e.id+'">'+tile(e)+"<span><h3>"+e.title+"</h3><p>"+(e.type==="match"?"Match":"Entraînement")+" · "+e.time+" · "+e.place+'</p></span><span class="arrow">›</span></button>'}
    function answer(e){let r=response(e,state.player);return ["<section class='answer'><div class='eyebrow'>Réponse attendue</div><h2>",e.title,"</h2><p>",e.type==="match"?"Disponibilité demandée avant la sélection officielle.":"Toute l’équipe est concernée.","</p><div class='meta'><span>📅 ",fmt(e.date),"</span><span>🕘 ",e.meeting," · RDV</span></div><div class='answer-actions'><button class='present ",r.status==="present"?"selected":"","' data-answer='present' data-id='",e.id,"'>✓ Présent</button><button class='absent ",r.status==="absent"?"selected":"","' data-answer='absent' data-id='",e.id,"'>× Absent</button></div>",r.reason?"<p style='margin-top:.7rem;font-size:.78rem'>Motif : "+r.reason+"</p>":"","</section>"].join("")}
    function profileCard(){let p=person(state.player),m=userEvents().find(e=>e.type==="match");return '<aside><section class="card account-card"><div><div class="eyebrow">Compte de test</div><h2>'+name(p)+'</h2></div><select class="picker" id="picker">'+players.map(x=>'<option value="'+x.id+'"'+(x.id===p.id?" selected":"")+">"+name(x)+"</option>").join("")+'</select></section>'+(m?'<section class="card pad" style="margin-top:1rem"><div class="eyebrow">Prochain match</div><h2 style="margin:.25rem 0;font-size:1.06rem">'+m.title+'</h2><p class="help">📅 '+fmt(m.date)+" · "+m.time+"<br>📍 "+m.place+'</p><div style="margin-top:.75rem">'+(m.published?'<span class="status published">✓ Groupe officiel publié</span>':tag(response(m,state.player)))+'</div></section>':"")+'<section class="card pad" style="margin-top:1rem"><div class="eyebrow">Mon profil</div><div class="profile"><div class="field"><span>Poste</span><b>'+p.position+'</b></div><div class="field"><span>Identifiant</span><b>'+p.user+'</b></div><div class="field"><span>Téléphone</span><b>'+p.phone+'</b></div><div class="field"><span>Accès</span><b>Code configuré</b></div></div></section></aside>'}
    function home(){let p=person(state.player),next=pending(),future=userEvents();return '<div class="grid"><section><div class="notice"><i>📌</i><div><div class="eyebrow">Info du coach</div><h2>À retenir cette semaine</h2><p>'+state.info+'</p></div></div><div class="head"><div><h2>À répondre</h2><p>Ta disponibilité aide l’équipe à s’organiser.</p></div></div>'+(next?answer(next):'<div class="empty">Tout est à jour. Merci '+p.first+" !</div>")+'<div class="head"><div><h2>À venir</h2><p>Matchs et entraînements de l’équipe.</p></div><button class="text" data-nav="agenda">Voir tout</button></div><div class="events">'+future.slice(0,3).map(row).join("")+'</div></section>'+profileCard()+"</div>"}
    function agenda(){return '<div class="head"><div><h2>Agenda</h2><p>Convocations, matchs et entraînements.</p></div></div><div class="events">'+userEvents().map(row).join("")+"</div>"}
    function participantList(e){if(e.type==="match"&&!e.published)return '<div class="block"><h3>Sélection officielle</h3><p class="help">Les disponibilités sont en cours de collecte. Le coach publiera le groupe lorsqu’il sera prêt.</p></div>';let ids=e.type==="match"?e.selected:e.invited;return '<div class="block"><h3>'+ (e.type==="match"?"Groupe officiel":"Participants")+'</h3>'+["Gardien","Défenseur","Milieu","Attaquant"].map(pos=>{let ps=ids.map(person).filter(p=>p&&p.position===pos);return ps.length?'<div class="block"><h3>'+pos+(pos==="Milieu"?"x":"s")+'</h3><div class="people">'+ps.map(p=>'<div class="person"><span class="avatar">'+initials(p)+'</span><span class="person-main"><b>'+name(p)+'</b><span>'+p.position+'</span></span>'+tag(response(e,p.id))+"</div>").join("")+"</div></div>":""}).join("")+"</div>"}
    function playerEvent(e){let r=response(e,state.player);return '<button class="text" data-nav="agenda">← Retour à l’agenda</button><section class="card detail"><div class="title"><div><div class="eyebrow">'+(e.type==="match"?"Match":"Entraînement")+'</div><h2>'+e.title+'</h2></div>'+(e.type==="match"&&e.published?'<span class="status published">Publié</span>':"")+'</div><div class="meta" style="color:var(--muted)"><span>📅 '+fmt(e.date)+"</span><span>🕘 "+e.meeting+"</span><span>📍 "+e.place+'</span></div><p class="help">'+e.description+'</p><div class="block"><h3>Ma réponse</h3><div class="answer-actions" style="max-width:360px"><button class="secondary '+(r.status==="present"?"selected":"")+'" data-answer="present" data-id="'+e.id+'">✓ Présent</button><button class="secondary danger '+(r.status==="absent"?"selected":"")+'" data-answer="absent" data-id="'+e.id+'">× Absent</button></div>'+(r.reason?'<p class="help">Motif transmis : '+r.reason+"</p>":"")+"</div>"+participantList(e)+"</section>"}
    function counts(e){return e.invited.reduce((x,id)=>{x[response(e,id).status]++;return x},{present:0,absent:0,pending:0})}
    function coachEvent(e){let c=counts(e),list=e.invited.map(id=>{let p=person(id),r=response(e,id),on=e.selected.includes(id);return ["<div class='person'><span class='avatar'>",initials(p),"</span><span class='person-main'><b>",name(p),"</b><span>",p.position,r.reason?" · "+r.reason:"","</span></span>",tag(r),e.type==="match"?"<button class='toggle "+(on?"on":"")+"' data-select-player='"+id+"'>"+(on?"✓":"+")+"</button>":"","</div>"].join("")}).join(""),buttons=e.type==="match"?["<button class='primary' data-action='publish'>",e.published?"Mettre à jour la publication":"Publier le groupe officiel","</button><button class='secondary' data-action='unpublish'>",e.published?"Retirer la publication":"Préparer sans publier","</button>"].join(""):"<button class='primary' data-action='close'>Clôturer les réponses</button>";return ["<section class='card detail'><div class='title'><div><div class='eyebrow'>",e.type==="match"?"Match à gérer":"Entraînement à gérer","</div><h2>",e.title,"</h2></div>",e.type==="match"?(e.published?"<span class='status published'>Publié</span>":"<span class='status pending-status'>Non publié</span>"):"","</div><div class='meta' style='color:var(--muted)'><span>📅 ",fmt(e.date),"</span><span>🕘 ",e.meeting,"</span></div><div class='block'><h3>",e.type==="match"?"Disponibilités et sélection":"Réponses des joueurs","</h3><div class='people'>",list,"</div></div><div class='actions'>",buttons,"</div><p class='help'>",c.present," présent(s) · ",c.absent," absent(s) · ",c.pending," sans réponse",e.type==="match"?" · "+e.selected.length+" joueur(s) sélectionné(s)":"","</p></section>"].join("")}
    function coach(){let e=event(state.event),c=counts(e);return '<div class="head"><div><h2>Espace coach</h2><p>Disponibilités, sélection et publication.</p></div></div><div class="tabs">'+events.map(x=>'<button data-event="'+x.id+'" class="'+(x.id===e.id?"active":"")+'">'+(x.type==="match"?"⚽ ":"🏃 ")+x.title+"</button>").join("")+'</div><div class="grid coach-grid" style="margin-top:1rem"><section>'+coachEvent(e)+'</section><aside><section class="card pad"><div class="eyebrow">Réponses en direct</div><div class="metrics" style="margin-top:.8rem"><div class="metric"><b style="color:var(--green)">'+c.present+'</b><span>Présents</span></div><div class="metric"><b style="color:var(--red)">'+c.absent+'</b><span>Absents</span></div><div class="metric"><b style="color:var(--amber)">'+c.pending+'</b><span>Sans réponse</span></div></div><p class="help">'+(e.type==="match"?(e.published?"Le groupe officiel est visible par les joueurs.":"La liste reste invisible aux joueurs tant que tu ne la publies pas."):"Chaque joueur répond pour cette séance.")+'</p></section><section class="card pad" style="margin-top:1rem"><div class="eyebrow">Info épinglée</div><p class="help" style="font-size:.87rem">'+state.info+'</p><button class="secondary" data-action="info">Modifier l’info de test</button></section></aside></div>'}
    function admin(){return '<div class="head"><div><h2>Administration</h2><p>Comptes, rôles et accès — simulation locale.</p></div></div><div class="notice"><i>🔐</i><div><div class="eyebrow">Prototype isolé</div><h2>Aucune donnée réelle n’est touchée</h2><p>Les changements disparaissent au rechargement. Le nouvel accès sécurisé sera branché seulement après validation UX.</p></div></div><section class="card detail" style="margin-top:1rem"><div class="title"><div><div class="eyebrow">Comptes de test</div><h2>Rôles de l’équipe</h2></div><span class="status pending-status">Admin historique conservé en local</span></div><div class="people block">'+players.map(p=>'<div class="person"><span class="avatar">'+initials(p)+'</span><span class="person-main"><b>'+name(p)+'</b><span>'+p.user+" · "+p.position+'</span></span><select class="admin-role" data-admin="'+p.id+'">'+["joueur","coach","admin"].map(r=>'<option value="'+r+'"'+(p.role===r?" selected":"")+">"+r[0].toUpperCase()+r.slice(1)+"</option>").join("")+"</select></div>").join("")+'</div></section><section class="card pad" style="margin-top:1rem"><div class="eyebrow">Prochaine étape réelle</div><h2 style="margin:.25rem 0;font-size:1.04rem">Brancher les comptes après validation UX</h2><p class="help">Identifiant unique, code à six chiffres, contrôle serveur et règles Firestore seront ajoutés à la couche de production — pas simulés ici.</p></section>'}
    function profile(){let p=person(state.player);return '<button class="text" data-action="back-profile">← Retour</button><div class="head"><div><h2>Mon profil</h2><p>Les informations utiles, rien de plus.</p></div></div><section class="card detail"><div class="person"><span class="avatar" style="width:3rem;height:3rem;font-size:.9rem">'+initials(p)+'</span><span class="person-main"><b style="font-size:1.05rem">'+name(p)+'</b><span>'+p.position+'</span></span></div><div class="profile"><div class="field"><span>Identifiant</span><b>'+p.user+'</b></div><div class="field"><span>Code personnel</span><b>Configuré</b></div><div class="field"><span>Téléphone</span><b>'+p.phone+'</b></div><div class="field"><span>Rôle de test</span><b>'+state.role+'</b></div></div><div class="actions"><button class="secondary">Modifier mon code</button><button class="secondary danger">Déconnexion (test)</button></div></section>'}
    function nav(){let links=state.role==="joueur"?[["accueil","⌂","Accueil"],["agenda","◷","Agenda"],["profil","◉","Profil"]]:state.role==="coach"?[["coach","◷","Coach"],["accueil","⌂","Joueur"],["profil","◉","Profil"]]:[["admin","⚙","Admin"],["coach","◷","Coach"],["accueil","⌂","Joueur"]];document.querySelector("#nav").innerHTML=links.map(x=>'<button class="nav '+(state.view===x[0]?"active":"")+'" data-nav="'+x[0]+'"><span>'+x[1]+"</span>"+x[2]+"</button>").join("")}
    function render(){document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("active",b.dataset.role===state.role));document.querySelector("#subtitle").textContent=state.role==="joueur"?"L’essentiel de l’équipe, sans détour.":state.role==="coach"?"Préparer le groupe et suivre les réponses.":"Gérer l’accès de l’équipe, sans quitter l’application.";if(state.profile||state.view==="profil")app.innerHTML=profile();else if(state.role==="admin"&&state.view==="admin")app.innerHTML=admin();else if(isCoach()&&state.view==="coach")app.innerHTML=coach();else if(state.view==="agenda")app.innerHTML=agenda();else if(state.view.startsWith("event:"))app.innerHTML=playerEvent(event(state.view.slice(6)));else app.innerHTML=home();nav();bind()}
    function bind(){
      document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.profile=false;state.view=b.dataset.nav;render()});
      document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{state.view="event:"+b.dataset.open;render()});
      document.querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>{state.event=b.dataset.event;render()});
      document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{let e=event(b.dataset.id);if(b.dataset.answer==="absent"){state.absenceEvent=e.id;dialog.showModal()}else{e.responses[state.player]={status:"present"};render()}});
      document.querySelectorAll("[data-select-player]").forEach(b=>b.onclick=()=>{let e=event(state.event),id=b.dataset.selectPlayer;e.selected=e.selected.includes(id)?e.selected.filter(x=>x!==id):[...e.selected,id];render()});
      document.querySelectorAll("[data-admin]").forEach(s=>s.onchange=()=>person(s.dataset.admin).role=s.value);
      let picker=document.querySelector("#picker");if(picker)picker.onchange=()=>{state.player=picker.value;render()};
      document.querySelectorAll("[data-action='publish']").forEach(b=>b.onclick=()=>{event(state.event).published=true;render()});
      document.querySelectorAll("[data-action='unpublish']").forEach(b=>b.onclick=()=>{event(state.event).published=false;render()});
      document.querySelectorAll("[data-action='close']").forEach(b=>b.onclick=()=>{event(state.event).closed=true;render()});
      document.querySelectorAll("[data-action='info']").forEach(b=>b.onclick=()=>{let n=prompt("Information épinglée de test",state.info);if(n&&n.trim())state.info=n.trim();render()});
      document.querySelectorAll("[data-action='back-profile']").forEach(b=>b.onclick=()=>{state.profile=false;state.view="accueil";render()});
    }
    document.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.profile=false;state.view=state.role==="joueur"?"accueil":state.role==="coach"?"coach":"admin";render()});
    document.querySelector("#profile").onclick=()=>{state.profile=true;render()};
    document.querySelectorAll("[data-reason]").forEach(b=>b.onclick=()=>{event(state.absenceEvent).responses[state.player]={status:"absent",reason:b.dataset.reason};dialog.close();state.absenceEvent=null;render()});
    document.querySelector("#no-reason").onclick=()=>{event(state.absenceEvent).responses[state.player]={status:"absent"};dialog.close();state.absenceEvent=null;render()};
    document.querySelector("#cancel-reason").onclick=()=>dialog.close();
    render();
  </script>
</body>
</html>
