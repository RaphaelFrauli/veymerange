<!doctype html>
<html lang="fr">

    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Pass D — Vétérans</title>
    <style>

        --paper: #f4f7f3;
        --card: #fff;
        --green: #08713d;
        --deep: #064d2a;
        --soft: #dff5e7;
        --red: #af3933;
        --redsoft: #ffe8e6;
        --amber: #986000;
        --ambersoft: #fff1d8;
        --blue: #1d629f;

      * {

      }

        background: var(--paper);

      .shell {

        font-size: 0.78rem;

      .bar b {
        color: #aaf5c1;
      }
      header {
        position: relative;
        overflow: hidden;
        background: linear-gradient(125deg, #075b32, #08713d 55%, #0d8d53);
        color: #fff;
        padding: 1.15rem 1rem 3.9rem;

        content: "";

        width: 34rem;
        height: 34rem;
        border: 1px solid #ffffff28;

        top: -25rem;

        color: #c3eecf;
        font-size: 0.72rem;
        font-weight: 800;

      .hero {

        color: #d7f3df;

      .metric b {
        display: block;

        font-weight: 700;

      .title {

        align-items: start;
        gap: 0.7rem;
      }
      .title h2 {
        margin: 0.2rem 0 0;
        font-size: 1.22rem;
      }

        padding-top: 1rem;
        border-top: 1px solid var(--line);

      .block h3 {
        margin: 0 0 0.65rem;
        font-size: 0.9rem;
      }
      .person {

        align-items: center;
        gap: 0.6rem;
        min-height: 43px;
      }

        height: 2rem;

        color: #fff;
        font-size: 0.7rem;
        font-weight: 800;

      .person-main {
        min-width: 0;

        display: block;
        font-size: 0.86rem;
      }
      .person-main span {
        color: var(--muted);
        font-size: 0.73rem;
      }
      .toggle {
        width: 2rem;

        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--muted);

      .toggle.on {
        border-color: var(--green);

        color: #fff;

      .toggle:disabled {
        border-color: #e2d6d4;
        background: #f5f1f0;
        color: #b4aaa8;
        cursor: not-allowed;
      }
      .actions {
        display: grid;
        gap: 0.55rem;
        margin-top: 1rem;
      }
      .feedback {

        padding: 0.65rem 0.75rem;
        border-radius: 10px;
        background: var(--soft);
        color: var(--deep);
        font-size: 0.82rem;
        font-weight: 800;

        border-radius: 11px;

        text-align: center;

        z-index: 10;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        padding: 0.45rem 0.7rem;
        border-top: 1px solid var(--line);
        background: #fffffff0;
      }
      .bottom div {
        display: flex;
        width: min(100%, 520px);

      .nav {
        flex: 1;
        border: 0;
        padding: 0.28rem 0.2rem;
        background: transparent;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 800;

      .nav span {

      .form-card {

      .form-grid {

      .two {

      .control {

      .mini {

      .mini button {

        font-size: 0.76rem;

      .admin-role {

        border-radius: 10px;

      @media (min-width: 700px) {

        }

        }
        .grid {
          grid-template-columns: minmax(0, 1.25fr) minmax(285px, 0.75fr);

      .coach-nav {

      .coach-nav button {

      .info-preview {

      }
      .danger-row {

      @media (min-width: 700px) {

          border-top: 1px solid var(--line);
          background: #fffffff0;
        }
        .bottom div {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <b>PASS D</b> — connexion sécurisée de l’équipe
    </div>
    <header>
      <div class="shell">
        <div class="top">
          <p class="club">CS Veymerange · Vétérans</p>
          <button class="account" id="account" hidden>Mon compte</button>

    <main class="shell" id="app"><div class="loading">Chargement…</div></main>
    <nav class="bottom"><div id="nav"></div></nav>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        setPersistence,
        browserLocalPersistence,
        onAuthStateChanged,

      import {

        addDoc,

        deleteDoc,
        onSnapshot,

      import {

        ref as storageRef,
        uploadBytes,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
      const config = {
          apiKey: "AIzaSyDVZJmOE4H-0DDVLgMbJHKHuIUKuw-z7N0",
          authDomain: "veymerange-f7b0b.firebaseapp.com",
          projectId: "veymerange-f7b0b",
          storageBucket: "veymerange-f7b0b.firebasestorage.app",
          messagingSenderId: "1056034963696",
          appId: "1:1056034963696:web:6e18d039bcb8e096264235",
        },
        fb = initializeApp(config),
        auth = getAuth(fb),
        db = getFirestore(fb),
        storage = getStorage(fb);
      const S = {
          user: null,
          me: null,
          members: [],
          events: [],
          view: "accueil",
          eventId: null,
          profile: false,
          mode: "login",
          error: "",
          dataStops: [],
          profileStop: null,
          eventStops: new Map(),
        },
        P = ["Gardien", "Défenseur", "Milieu", "Attaquant"],
        app = document.querySelector("#app"),
        nav = document.querySelector("#nav"),
        bar = document.querySelector("#bar"),
        account = document.querySelector("#account"),
        subtitle = document.querySelector("#subtitle");
      const esc = (x) =>
          String(x ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          ),
        norm = (x) =>
          String(x || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/\s+/g, "")
            .replace(/[^a-z0-9]/g, ""),
        mail = (x) => norm(x) + "@veymerange.test",

        .player-banner-initials{background:transparent;color:#08713d30;font-size:6rem;letter-spacing:-.08em}
        .player-details-toggle{background:#f9fcfa;border-top:1px solid #dceadf;min-height:42px;font-size:.7rem;letter-spacing:.03em}
        .player-info-row{padding:1.3rem 0;margin:0 1.6rem;border-top:0}
        .player-info-row b{font-size:.63rem;letter-spacing:.09em}
        .player-stats{margin:0 1.6rem;padding:.35rem 0 1.3rem;border-top:1px solid #e3ece6}
        .player-stats h3{font-size:.68rem;letter-spacing:.16em}
        .player-stats b{font-size:1.8rem;font-weight:800}
        .player-edit-link{margin-top:.25rem}
        @media(max-width:650px){
          .player-banner,.player-identity{min-height:270px}
          .player-identity{width:57%;padding:1.3rem 1rem}
          .player-number{font-size:4.8rem}
          .player-lastname{font-size:1.45rem}
          .player-name{font-size:1.22rem}
          .player-nickname{font-size:.65rem;letter-spacing:.05em}
          .player-position{font-size:.74rem}
          .player-photo{width:52%;right:0}
          .player-photo-silhouette img{width:145%;max-width:none;margin-left:-22.5%;transform:translateY(-3%)}
          .player-watermark{width:210px;left:59%}
          .player-info-row,.player-stats{margin-left:1rem;margin-right:1rem}
        }
        @media(prefers-reduced-motion:reduce){.player-details{transition:none}}
      `;
      document.head.append(refinedBannerStyle);
      const portraitMask = document.createElementNS('http://www.w3.org/2000/svg','svg');
      portraitMask.setAttribute('width','0'); portraitMask.setAttribute('height','0');
      portraitMask.setAttribute('aria-hidden','true');
      portraitMask.style.position='absolute';
      portraitMask.innerHTML = '<defs><clipPath id="camille-portrait-outline" clipPathUnits="objectBoundingBox"><path d="M .5 .084 C .568 .08 .61 .105 .624 .16 C .634 .18 .624 .209 .63 .229 C .651 .229 .644 .274 .625 .292 C .618 .324 .604 .345 .608 .377 C .652 .397 .765 .422 .812 .448 C .855 .465 .882 .499 .899 .539 C .922 .592 .936 .663 .946 .71 L .952 .739 C .93 .75 .931 .812 .909 .844 C .883 .879 .85 .9 .808 .916 L .81 1 L .192 1 L .19 .916 C .126 .89 .086 .85 .072 .807 C .066 .775 .061 .748 .051 .733 C .064 .674 .081 .585 .104 .531 C .122 .489 .148 .467 .192 .448 C .239 .427 .321 .398 .382 .38 L .391 .361 C .37 .33 .363 .305 .361 .285 C .341 .265 .347 .23 .362 .225 C .36 .162 .375 .127 .416 .104 C .443 .088 .47 .084 .5 .084 Z"/></clipPath></defs>';
      document.body.append(portraitMask);
      refinedBannerStyle.textContent += '.player-photo-silhouette img{clip-path:url(#camille-portrait-outline)}';

      const playerBirthDate = (value) => {
        const date = new Date(String(value) + "T12:00:00");
        if (isNaN(date)) return "—";
        const now = new Date(), month = String(date.getMonth() + 1).padStart(2, "0"), day = String(date.getDate()).padStart(2, "0");
        let age = now.getFullYear() - date.getFullYear();
        if (now.getMonth() < date.getMonth() || (now.getMonth() === date.getMonth() && now.getDate() < date.getDate())) age--;
        return `${day}/${month}/${String(date.getFullYear()).slice(-2)} (${age} ans)`;
      };
      playerEditor = function (member) {
        if (!member || !rosterCanManage()) return "";
        const photo = member.photoUrl || (norm(nm(member)).startsWith("camilleboure") ? "PHOTOS/camille%20bouret.png" : "");
        return `<div class="roster-editor-modal"><button class="roster-modal-backdrop" type="button" data-roster-edit-close aria-label="Fermer"></button><section class="roster-editor-dialog player-edit-dialog" role="dialog" aria-modal="true"><div class="title"><div><div class="eyebrow">Effectif</div><h2>Modifier ${esc(nm(member))}</h2></div><button class="player-photo-close" type="button" data-roster-edit-close aria-label="Fermer">×</button></div><form class="roster-manager-form" data-roster-member-v5="${member.id}">${S.rosterUploadError ? `<p class="form-error roster-manager-wide">${esc(S.rosterUploadError)}</p>` : ""}<label>Prénom<input name="firstName" value="${esc(member.firstName || "")}"></label><label>Nom<input name="lastName" value="${esc(member.lastName || "")}"></label><label>Poste<input name="position" value="${esc(member.position || "")}"></label><label>Numéro<input name="shirtNumber" inputmode="numeric" value="${esc(member.shirtNumber || "")}"></label><label>Surnom<input name="nickname" value="${esc(member.nickname || "")}"></label><label>Date de naissance<input name="birthDate" type="date" value="${esc(member.birthDate || "")}"></label><label>Taille (cm)<input name="height" type="number" min="0" value="${esc(member.height || "")}"></label><label>Poids (kg)<input name="weight" type="number" min="0" value="${esc(member.weight || "")}"></label><label>Pied fort<select name="strongFoot"><option value="">Non renseigné</option><option value="Droit" ${member.strongFoot === "Droit" ? "selected" : ""}>Droit</option><option value="Gauche" ${member.strongFoot === "Gauche" ? "selected" : ""}>Gauche</option><option value="Ambidextre" ${member.strongFoot === "Ambidextre" ? "selected" : ""}>Ambidextre</option></select></label><label class="roster-manager-wide">Fait marquant<input name="factHighlight" value="${esc(member.factHighlight || "")}" placeholder="Ex. Capitaine de l'équipe, meilleur buteur 2025…"></label><label>Matchs<input name="matches" type="number" min="0" value="${playerCardStats(member).matches}"></label><label>Buts<input name="goals" type="number" min="0" value="${Number(member.goals || 0)}"></label><label>Passes décisives<input name="assists" type="number" min="0" value="${Number(member.assists || 0)}"></label><label class="roster-manager-wide player-photo-upload"><span>Photo du joueur</span><input name="photoFile" type="file" accept="image/*"><small>Sur téléphone : choisissez une image depuis votre galerie ou vos fichiers. PNG transparent conseillé · 8 Mo maximum.</small></label><label class="roster-manager-wide">Ou URL de la photo<input name="photoUrl" type="url" value="${esc(photo)}" placeholder="https://…"></label><button type="submit" class="primary roster-manager-wide">Enregistrer</button></form></section></div>`;
      };
      rosterScreen = function () {
        const players = S.members.filter(member => member.status === "approved" && member.active !== false && !hiddenTeamAccount(member)).sort((a, b) => nm(a).localeCompare(nm(b)));
        const photoUrl = member => member.photoUrl || (norm(nm(member)).startsWith("camilleboure") ? "PHOTOS/camille%20bouret.png" : "");
        const card = member => {
          const photo = photoUrl(member), stats = playerCardStats(member), open = S.rosterDetailsId === member.id;
          const portrait = photo ? `<img src="${esc(photo)}" alt="Photo de ${esc(nm(member))}">` : `<span class="player-banner-initials">${ini(member)}</span>`;
          return `<article class="player-card"><div class="player-banner"><img class="player-watermark" src="icon-512.png" alt=""><div class="player-shapes"></div><div class="player-identity"><strong class="player-number">${esc(member.shirtNumber || "—")}</strong><span class="player-lastname">${esc(member.lastName || "Joueur")}</span><h2 class="player-name">${esc(member.firstName || nm(member))}</h2>${member.nickname ? `<p class="player-nickname">${esc(member.nickname)}</p>` : ""}<p class="player-position">${esc(playerPositionLabel(member.position))}</p></div><button type="button" class="player-photo ${isOriginalCamillePhoto(photo) ? "player-photo-silhouette" : ""}" data-roster-photo="${member.id}" aria-label="Voir la photo complète de ${esc(nm(member))}">${portrait}</button></div><div class="player-card-actions"><button type="button" class="player-details-toggle" data-player-details="${member.id}" aria-expanded="${open}">${open ? "Masquer la fiche" : "Voir la fiche"} <span>⌄</span></button>${rosterCanManage() ? `<button class="player-edit-link" type="button" data-roster-edit="${member.id}">Modifier la fiche</button>` : ""}</div><div class="player-details ${open ? "open" : ""}"><div class="player-info-row"><span><b>Né le</b>${esc(playerBirthDate(member.birthDate))}</span><span><b>Taille</b>${esc(member.height ? member.height + " cm" : "—")}</span><span><b>Poids</b>${esc(member.weight ? member.weight + " kg" : "—")}</span></div><div class="player-info-extra"><span><b>Pied fort</b>${esc(member.strongFoot || "—")}</span><span class="player-highlight"><b>Fait marquant</b>${esc(member.factHighlight || "À renseigner")}</span></div><div class="player-stats"><h3>Stats</h3><div><span><b>${stats.matches}</b>Matchs</span><span><b>${stats.goals}</b>Buts</span><span><b>${stats.assists}</b>Passes décisives</span></div></div></div></article>`;
        };
        const edited = players.find(member => member.id === S.rosterEditId), photoMember = players.find(member => member.id === S.rosterPhotoMemberId);
        const modal = photoMember ? `<div class="player-photo-modal"><button type="button" class="player-photo-backdrop" data-roster-photo-close aria-label="Fermer"></button><section class="player-photo-modal-card" role="dialog" aria-modal="true"><button type="button" class="player-photo-close" data-roster-photo-close aria-label="Fermer">×</button><img src="${esc(photoUrl(photoMember))}" alt="Photo complète de ${esc(nm(photoMember))}"></section></div>` : "";
        return `<div class="head"><div><h2>Effectif</h2><p>Les fiches des joueurs et leurs statistiques.</p></div></div><section class="player-card-list">${players.map(card).join("") || '<div class="empty">Aucun joueur actif pour le moment.</div>'}</section>${playerEditor(edited)}${modal}`;
      };
      refinedBannerStyle.textContent += '.player-card-actions{display:flex;gap:.5rem;padding:.55rem .8rem;border-top:1px solid #dceadf;background:#f9fcfa}.player-card-actions .player-details-toggle{flex:1;border:0;background:transparent}.player-card-actions .player-edit-link{display:inline-flex;align-items:center;justify-content:center;min-height:34px;margin:0;padding:.35rem .7rem;border:1px solid #a7cfb2;border-radius:8px;background:#fff;color:#075b32;font-size:.68rem}.player-info-row{background:#f8fbf9;border-radius:12px;margin-top:1rem;margin-bottom:.55rem}.player-info-extra{display:grid;grid-template-columns:minmax(140px,.35fr) 1fr;gap:0;margin:0 1.6rem;padding:0 0 1.1rem;border-bottom:1px solid #e3ece6}.player-info-extra span{padding:.25rem .75rem;text-align:center;font-size:.75rem;font-weight:800}.player-info-extra span+span{border-left:1px solid #dce8df}.player-info-extra b{display:block;margin-bottom:.3rem;color:#6b8272;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase}.player-highlight{color:#075b32}.player-highlight b:before{content:"★ ";color:#159653}.roster-manager-form small{color:var(--muted);font-weight:600;line-height:1.35}.player-photo-upload{padding:.75rem;border:1px dashed #9bc7a8;border-radius:10px;background:#f7fbf8}.player-photo-upload>span{color:var(--deep);font-weight:900}.player-photo-upload input{margin-top:.35rem}.player-photo-upload small{display:block;margin-top:.35rem}@media(max-width:650px){.player-info-extra{grid-template-columns:1fr;margin-left:1rem;margin-right:1rem}.player-info-extra span+span{border-left:0;border-top:1px solid #edf3ee;padding-top:.65rem}.player-card-actions{padding:.45rem .55rem}}';
    </script>
  </body>
</html>
