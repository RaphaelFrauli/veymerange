function coachEvent(e){if(!e)return '<div class="empty">Sélectionne ou crée un événement.</div>';let c=counts(e),list=people(e).map(p=>{let r=resp(e,p.id),on=e.selected.includes(p.id),abs=r.status==="absent";return '<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.position||"")+(r.reason?" · "+esc(r.reason):"")+'</span></span>'+tag(r)+(e.type==="match"?'<button class=\"toggle '+(on?"on":"")+'" data-select="'+p.id+'" '+(abs?'disabled title="Joueur absent"':"")+">"+(on?"✓":"+")+"</button>":"")+"</div>"}).join(""),btn=e.type==="match"?'<button class="primary" data-act="publish">'+(e.published?"Mettre à jour le groupe":"Publier le groupe officiel")+'</button><button class="secondary" data-act="unpublish">'+(e.published?"Retirer la publication":"Préparer sans publier")+'</button>':'<button class="primary" data-act="close">Clôturer les réponses</button>';return '<section class="card detail"><div class="title"><div><div class="eyebrow">'+(e.type==="match"?"Match à gérer":"Entraînement à gérer")+'</div><h2>'+esc(e.title)+'</h2></div>'+(e.type==="match"?(e.published?'<span class="status published">Publié</span>':'<span class="status pending-status">Non publié</span>'):"")+'</div><div class="meta" style="color:var(--muted)"><span>📅 '+fmt(e.date)+"</span><span>🕘 "+esc(e.meeting)+'</span></div><div class="block"><h3>'+ (e.type==="match"?"Disponibilités et sélection":"Réponses des joueurs")+'</h3>'+(e.type==="match"?'<p class="feedback">'+e.selected.length+" joueur(s) sélectionné(s)</p>":"")+'<div class="people">'+(list||'<p class="help">Aucun joueur approuvé pour le moment.</p>')+"</div></div><div class=\"actions\">"+btn+"</div><p class=\"help\">"+c.present+" présent(s) · "+c.absent+" absent(s) · "+c.pending+" sans réponse</p></section>"}
function coachScreen(){let e=ev(),c=e?counts(e):{present:0,absent:0,pending:0};return '<div class="head"><div><h2>Espace coach</h2><p>Disponibilités, sélection et publication en direct.</p></div></div><div class="tabs">'+S.events.map(x=>'<button data-event="'+x.id+'" class="'+(x.id===e?.id?"active":"")+'">'+(x.type==="match"?"⚽":"🏃")+" "+esc(x.title)+"</button>").join("")+'</div><div class="actions" style="margin-top:.75rem"><button class="primary" data-act="create" data-type="match">+ Ajouter un match</button><button class="secondary" data-act="create" data-type="training">+ Ajouter un entraînement</button></div><div class="grid coach-grid" style="margin-top:1rem"><section>'+coachEvent(e)+'</section><aside><section class="card pad"><div class="eyebrow">Réponses en direct</div><div class="metrics" style="margin-top:.8rem"><div class="metric"><b style="color:var(--green)">'+c.present+'</b><span>Présents</span></div><div class="metric"><b style="color:var(--red)">'+c.absent+'</b><span>Absents</span></div><div class="metric"><b style="color:var(--amber)">'+c.pending+'</b><span>Sans réponse</span></div></div><p class="help">'+(e?.type==="match"?(e.published?"Le groupe officiel est visible par les joueurs.":"La liste reste invisible aux joueurs tant que tu ne la publies pas."):"Chaque joueur répond pour cette séance.")+"</p></section></aside></div>"}
function adminScreen(){let pend=S.members.filter(p=>p.status==="pending"),ok=S.members.filter(p=>p.status==="approved"&&p.active!==false);return '<div class="head"><div><h2>Administration</h2><p>Inscriptions, rôles et données de l’équipe.</p></div></div><div class="admin-grid"><section class="card detail"><div class="eyebrow">Demandes d’inscription</div><h2 style="margin:.2rem 0">À valider</h2><div class="people block">'+(pend.map(p=>'<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.identifier||"")+" · "+esc(p.position||"")+" · "+esc(p.phone||"sans téléphone")+'</span></span><span class="mini"><button class="primary" data-approve="'+p.id+'">Valider</button><button class="secondary danger" data-reject="'+p.id+'">Refuser</button></span></div>').join("")||'<p class="help">Aucune demande en attente.</p>')+'</div></section><section class="card detail"><div class="eyebrow">Membres</div><h2 style="margin:.2rem 0">Rôles approuvés</h2><div class="people block">'+(ok.map(p=>'<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.identifier||"")+" · "+esc(p.position||"")+'</span></span><select class="admin-role" data-role="'+p.id+'" '+(p.id===S.user.uid?'disabled title="Ton propre rôle ne peut pas être modifié ici"':"")+">"+["joueur","coach","admin"].map(r=>'<option value="'+r+'" '+(p.role===r?"selected":"")+">"+r[0].toUpperCase()+r.slice(1)+"</option>").join("")+"</select></div>").join("")||'<p class="help">Aucun membre approuvé.</p>')+'</div></section></div>'+(!S.events.length?'<section class="card pad" style="margin-top:1rem"><div class="eyebrow">Données de démonstration</div><h2 style="margin:.25rem 0;font-size:1.04rem">Démarrer le test</h2><p class="help">Crée une seule fois les matchs et entraînements de démonstration dans Firestore.</p><div class="actions"><button class="primary" data-act="seed">Initialiser les données de test</button></d function render(){let ready=S.me?.status==="approved"&&S.me?.active!==false;account.hidden=!ready;bar.innerHTML=S.user?'<b>CONNECTÉ</b> — données synchronisées en temps réel':'<b>PASS D</b> — connexion sécurisée de l’équipe';subtitle.textContent=!ready?"L’essentiel de l’équipe, sans détour.":admin()?"Gérer l’accès de l’équipe, sans quitter l’application.":coach()?"Préparer le groupe et suivre les réponses.":"L’essentiel de l’équipe, sans détour.";if(!S.user)app.innerHTML=authScreen();else if(!S.me)app.innerHTML='<div class="loading">Chargement du compte…</div>';else if(!ready)app.innerHTML=waiting();else if(S.profile||S.view==="profil")app.innerHTML=profile();else if(S.view.startsWith("event:")){let e=S.events.find(x=>x.id===S.view.slice(6));app.innerHTML=e?playerEvent(e):'<div class="empty">Événement introuvable.</div>'}else if(admin()&&S.view==="admin")app.innerHTML=adminScreen();else if(coach()&&S.view==="coach")app.innerHTML=coachScreen();else if(S.view==="agenda")app.innerHTML=agenda();else app.innerHTML=home();let links=admin()?[["admin","⚙","Admin"],["coach","◷","Coach"],["accueil","⌂","Joueur"]]:coach()?[["coach","◷","Coach"],["accueil","⌂","Joueur"],["profil","◉","Profil"]]:[["accueil","⌂","Accueil"],["agenda","◷","Agenda"],["profil","◉","Profil"]];nav.innerHTML=ready?links.map(x=>'<button class="nav '+(S.view===x[0]?"active":"")+'" data-nav="'+x[0]+'"><span>'+x[1]+"</span>"+x[2]+"</button>").join(""):"";bind()}

function bind(){let f=document.querySelector("#auth-form");if(f)f.onsubmit=e=>{e.preventDefault();S.mode==="signup"?signup(e.currentTarget):login(e.currentTarget)};document.querySelector("#switch")?.addEventListener("click",()=>{S.mode=S.mode==="login"?"signup":"login";S.error="";render()});document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.profile=false;S.view=b.dataset.nav;render()});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.profile=false;S.view="event:"+b.dataset.open;render()});document.querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>{S.eventId=b.dataset.event;render()});document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(b.dataset.id,b.dataset.answer));document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>select(b.dataset.select));document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>approve(b.dataset.approve));document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"users",b.dataset.reject),{status:"rejected",active:false}).catch(err));document.querySelectorAll("[data-role]").forEach(x=>x.onchange=()=>updateDoc(doc(db,"users",x.dataset.role),{role:x.value}).catch(err));document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==="publish")publish();if(a==="unpublish")updateDoc(doc(db,"events",ev().id),{published:false}).catch(err);if(a==="close")updateDoc(doc(db,"events",ev().id),{closed:true}).catch(err);if(a==="create")create(b.dataset.type);if(a==="seed")seed()});document.querySelectorAll("#logout").forEach(b=>b.onclick=()=>signOut(auth))}

const coachCommandStyle=document.createElement('style');coachCommandStyle.textContent='.coach-command{margin:1rem 0;padding:1rem;border-radius:18px;background:linear-gradient(135deg,#123b2a,#08713d);color:#fff;box-shadow:0 12px 25px #075d3430}.coach-command .eyebrow,.coach-command p{color:#d8f4e1}.coach-command h2{margin:.25rem 0;font-size:1.28rem}.coach-command p{margin:0;font-size:.86rem}.coach-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}.coach-kpi{padding:.7rem .45rem;border:1px solid #ffffff30;border-radius:12px;background:#ffffff14;text-align:center}.coach-kpi b{display:block;font-size:1.2rem}.coach-kpi span{font-size:.68rem;font-weight:800;color:#d8f4e1}.coach-priority{display:flex;align-items:center;justify-content:space-between;gap:.7rem;margin-top:.8rem;padding:.7rem;border-radius:12px;background:#fff;color:var(--ink)}.coach-priority .eyebrow{color:var(--muted)}.coach-priority b{display:block;margin-top:.15rem;font-size:.9rem}.coach-priority button{flex:0 0 auto;min-height:38px;border:0;border-radius:9px;padding:.35rem .6rem;background:var(--green);color:#fff;font-size:.74rem;font-weight:900}@media(min-width:700px){.coach-command{display:grid;grid-template-columns:1fr auto;align-items:end;gap:1.5rem}.coach-kpis{width:300px}.coach-priority{grid-column:1/-1}}';document.head.append(coachCommandStyle);
function coachCommandPanel(){let events=sortedEvents(()=>true),open=events.filter(event=>!event.closed),waiting=open.reduce((total,event)=>total+counts(event).pending,0),published=events.filter(event=>event.type==='match'&&event.published).length,priority=open.find(event=>event.type==='match'&&!event.published)||open[0];return '<section class="coach-command"><div><div class="eyebrow">Tableau de bord coach</div><h2>Pilote l’équipe, pas ta propre convocation.</h2><p>Réponses, groupes et informations à traiter en un coup d’œil.</p></div><div class="coach-kpis"><div class="coach-kpi"><b>'+open.length+'</b><span>À gérer</span></div><div class="coach-kpi"><b>'+waiting+'</b><span>Réponses en attente</span></div><div class="coach-kpi"><b>'+published+'</b><span>Groupes publiés</span></div></div>'+(priority?'<div class="coach-priority"><div><div class="eyebrow">Action prioritaire</div><b>'+esc(priority.title)+'</b></div><button data-coach-open="'+priority.id+'">Gérer l’événement →</button></div>':'<div class="coach-priority"><div><div class="eyebrow">Équipe à jour</div><b>Aucun événement à gérer pour le moment.</b></div><button data-coach-form="match">Créer un match</button></div>')+'</section>'}
const coachScreenWithCommand=coachScreen;coachScreen=function(){let detail=S.coachDetailId&&S.events.find(event=>event.id===S.coachDetailId);if(detail||S.coachForm)return coachScreenWithCommand();let screen=coachScreenWithCommand(),panel=coachCommandPanel();return screen.replace('<div class="coach-nav">',panel+'<div class="coach-nav">')};
coachCommandStyle.remove();coachScreen=coachScreenWithCommand;
const coachHomeStyle=document.createElement('style');coachHomeStyle.textContent='.coach-home-intro{padding:1.05rem;border:1px solid #cfe1d5;border-radius:18px;background:linear-gradient(135deg,#e7f5eb,#fff)}.coach-home-intro h2{margin:.2rem 0;font-size:1.35rem}.coach-home-intro p{margin:.25rem 0 0;color:var(--muted);font-size:.88rem}.coach-home-actions{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:1rem}.coach-home-actions button{min-height:48px;border:1px solid #b8d8c3;border-radius:12px;background:#fff;color:var(--deep);font-weight:900;text-align:left;padding:.7rem}.coach-home-actions button span{display:block;margin-top:.18rem;color:var(--muted);font-size:.7rem;font-weight:700}.coach-home-list{display:grid;gap:.6rem}.coach-home-event{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;width:100%;padding:.85rem;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left}.coach-home-event h3{margin:.15rem 0;font-size:.94rem}.coach-home-event p{margin:0;color:var(--muted);font-size:.77rem}.coach-home-event .coach-type{font-size:.68rem;font-weight:900;color:var(--green);text-transform:uppercase;letter-spacing:.06em}.coach-home-event.training .coach-type{color:#1d629f}.coach-home-event .arrow{font-size:1.25rem}@media(min-width:700px){.coach-home-actions{grid-template-columns:repeat(3,1fr)}}';document.head.append(coachHomeStyle);
function coachHome(){let today=new Date().toISOString().slice(0,10),events=sortedEvents(event=>String(event.date)>=today),eventRow=event=>'<button class="coach-home-event '+(isTrainingV2(event)?'training':'')+'" data-coach-home-open="'+event.id+'"><span class="date"><b>'+new Date(event.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric'})+'</b><span>'+new Date(event.date+'T12:00:00').toLocaleDateString('fr-FR',{month:'short'}).replace('.','')+'</span></span><span><span class="coach-type">'+(isTrainingV2(event)?'Entraînement':'Match')+'</span><h3>'+esc(event.title)+'</h3><p>🕘 '+esc(event.time)+' · 📍 '+esc(event.place)+'</p></span><span class="arrow">›</span></button>';return '<section class="coach-home-intro"><div class="eyebrow">Accueil coach</div><h2>Prépare les prochains rendez-vous.</h2><p>Crée les événements, consulte les réponses et publie les groupes depuis l’espace Coach.</p><div class="coach-home-actions"><button data-nav="coach">Gérer l’équipe<span>Matchs, groupes et réponses</span></button><button data-coach-home-create="match">+ Ajouter un match<span>Créer une rencontre</span></button><button data-coach-home-create="entrainement">+ Ajouter un entraînement<span>Planifier une séance</span></button></div></section><div class="head"><div><h2>À venir</h2><p>Les prochains événements de l’équipe.</p></div><button class="text" data-nav="coach">Tout gérer</button></div><div class="coach-home-list">'+(events.map(eventRow).join('')||'<div class="empty">Aucun événement à venir.</div>')+'</div>'}
document.addEventListener('click',event=>{let button=event.target.closest('button');if(!button)return;if(button.matches('[data-coach-home-open]')){S.view='coach';S.coachDetailId=button.dataset.coachHomeOpen;S.eventId=button.dataset.coachHomeOpen;event.preventDefault();event.stopImmediatePropagation();render()}if(button.matches('[data-coach-home-create]')){S.view='coach';S.coachTab=button.dataset.coachHomeCreate==='match'?'matches':'trainings';S.coachForm=button.dataset.coachHomeCreate;event.preventDefault();event.stopImmediatePropagation();render()}},true);
const playerHomeScreen=home;home=function(){return coach()?coachHome():playerHomeScreen()};
const coachPlayersStyle=document.createElement('style');coachPlayersStyle.textContent='.coach-nav{grid-template-columns:repeat(5,minmax(0,1fr));max-width:760px}.coach-roster{display:grid;gap:.65rem}.coach-player{padding:.85rem}.coach-player-top{display:flex;align-items:center;gap:.65rem}.coach-player-top .person-main{flex:1}.coach-player-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.75rem}.coach-player-stat{padding:.48rem .25rem;border-radius:9px;background:var(--paper);text-align:center}.coach-player-stat b{display:block;font-size:.95rem;color:var(--deep)}.coach-player-stat span{display:block;color:var(--muted);font-size:.62rem;font-weight:800}.coach-player-stat.selected b{color:var(--blue)}.coach-player-stat.absent b{color:var(--red)}';document.head.append(coachPlayersStyle);
function coachPlayersScreen(){let members=S.members.filter(member=>member.status==='approved'&&member.active!==false&&member.isPlayer!==false&&!(member.role==='admin'&&member.identifier==='admin')).sort((a,b)=>String(a.position||'').localeCompare(String(b.position||''))||nm(a).localeCompare(nm(b))),stats=member=>{let relevant=event=>!event.invited?.length||event.invited.includes(member.id),matches=S.events.filter(event=>event.type==='match'&&relevant(event)),responses=S.events.filter(relevant).map(event=>resp(event,member.id));return{matches:matches.length,selected:matches.filter(event=>event.selected?.includes(member.id)).length,present:responses.filter(response=>response.status==='present').length,absent:responses.filter(response=>response.status==='absent').length}},player=member=>{let s=stats(member);return '<section class="card coach-player"><div class="coach-player-top"><span class="avatar">'+ini(member)+'</span><span class="person-main"><b>'+esc(nm(member))+'</b><span>'+esc(member.position||'Poste à préciser')+'</span></span><span class="status present-status">Actif</span></div><div class="coach-player-stats"><div class="coach-player-stat"><b>'+s.matches+'</b><span>Matchs</span></div><div class="coach-player-stat selected"><b>'+s.selected+'</b><span>Convoqué</span></div><div class="coach-player-stat"><b>'+s.present+'</b><span>Présent</span></div><div class="coach-player-stat absent"><b>'+s.absent+'</b><span>Absent</span></div></div></section>'};return '<div class="head"><div><h2>Joueurs</h2><p>'+members.length+' joueur(s) actif(s) · statistiques de la saison visible.</p></div></div><div class="coach-roster">'+(members.map(player).join('')||'<div class="empty">Aucun joueur actif pour le moment.</div>')+'</div>'}
const coachScreenWithPlayers=coachScreen;coachScreen=function(){let tab=S.coachTab||'matches',navigation='<div class="head"><div><h2>Espace coach</h2><p>Prépare l’équipe et partage les informations.</p></div></div><div class="coach-nav"><button data-coach-tab="matches" class="'+(tab==='matches'?'active':'')+'">Matchs</button><button data-coach-tab="trainings" class="'+(tab==='trainings'?'active':'')+'">Entraînements</button><button data-coach-tab="sessions" class="'+(tab==='sessions'?'active':'')+'">Séances</button><button data-coach-tab="info" class="'+(tab==='info'?'active':'')+'">Info du coach</button><button data-coach-tab="players" class="'+(tab==='players'?'active':'')+'">Joueurs</button></div>';if(tab==='players')return navigation+coachPlayersScreen();let screen=coachScreenWithPlayers();return screen.replace('>Info du coach</button></div>','>Info du coach</button><button data-coach-tab="players">Joueurs</button></div>')};
