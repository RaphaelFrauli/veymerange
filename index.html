const config={apiKey:"AIzaSyDVZJmOE4H-0DDVLgMbJHKHuIUKuw-z7N0",authDomain:"veymerange-f7b0b.firebaseapp.com",projectId:"veymerange-f7b0b",storageBucket:"veymerange-f7b0b.firebasestorage.app",messagingSenderId:"1056034963696",appId:"1:1056034963696:web:6e18d039bcb8e096264235"},fb=initializeApp(config),auth=getAuth(fb),db=getFirestore(fb);
const S={user:null,me:null,members:[],events:[],view:"accueil",eventId:null,profile:false,mode:"login",error:"",dataStops:[],profileStop:null,eventStops:new Map()},P=["Gardien","Défenseur","Milieu","Attaquant"],app=document.querySelector("#app"),nav=document.querySelector("#nav"),bar=document.querySelector("#bar"),account=document.querySelector("#account"),subtitle=document.querySelector("#subtitle");

function authScreen(){let up=S.mode==="signup";return '<section class="card form-card"><div class="eyebrow">CS Veymerange · Vétérans</div><h2>'+ (up?"Créer un compte":"Connexion")+'</h2><p class="help">'+(up?"Ton inscription sera validée par un administrateur avant l’accès à Pass D.":"Les joueurs utilisent leur identifiant. L’administrateur peut utiliser son e-mail.")+'</p><form id="auth-form" class="form-grid">'+(up?'<div class="form-grid two"><label class="control">Prénom<input name="firstName" required></label><label class="control">Nom<input name="lastName" required></label></div>':"")+'<label class="control">'+(up?"Identifiant":"Identifiant ou e-mail admin")+'<input name="identifier" required autocapitalize="none"></label>'+(up?'<label class="control">Téléphone <small>(facultatif)</small><input name="phone"></label><label class="control">Poste<select name="position">'+P.map(x=>"<option>"+x+"</option>").join("")+"</select></label>":"")+'<label class="control">Mot de passe<input name="password" type="password" minlength="6" required></label>'+(up?'<label class="control">Confirmation du mot de passe<input name="confirmation" type="password" minlength="6" required></label>':"")+'<button class="primary">'+(up?"Créer mon compte":"Se connecter")+'</button></form>'+(S.error?'<p class="form-error">'+esc(S.error)+"</p>":"")+'<button class="text" id="switch">'+(up?"J’ai déjà un compte":"Créer un compte")+"</button></section>"}

function agenda(){let es=S.events.filter(e=>!e.invited.length||e.invited.includes(S.user.uid));return '<div class="head"><div><h2>Agenda</h2><p>Convocations, matchs et entraînements.</p></div></div><div class="events">'+(es.map(row).join("")||'<div class="empty">Aucun événement pour le moment.</div>')+"</div>"}
function group(e){if(e.type==="match"&&!e.published)return '<div class="block"><h3>Sélection officielle</h3><p class="help">Les disponibilités sont en cours de collecte. Le coach publiera le groupe lorsqu’il sera prêt.</p></div>';let ids=e.type==="match"?e.selected:e.invited,me=e.selected.includes(S.user.uid);return '<div class="block"><h3>'+ (e.type==="match"?"Groupe officiel":"Participants")+'</h3>'+(e.type==="match"?'<p class="feedback">'+(me?"✓ Tu es convoqué":"Tu n’es pas sélectionné pour ce match")+"</p>":"")+P.map(pos=>{let ps=ids.map(id=>S.members.find(x=>x.id===id)).filter(p=>p?.position===pos);return ps.length?'<div class="block"><h3>'+pos+(pos==="Milieu"?"x":"s")+'</h3><div class="people">'+ps.map(p=>'<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.position)+'</span></span></div>').join("")+"</div></div>":""}).join("")+"</div>"}
function playerEvent(e){let r=resp(e),locked=e.closed||(e.type==="match"&&e.published),m=e.closed?"Les réponses sont clôturées. Contacte le coach si ta disponibilité change.":"Le groupe officiel a été publié. Contacte le coach si ta disponibilité change.";return '<button class="text" data-nav="agenda">← Retour à l’agenda</button><section class="card detail"><div class="title"><div><div class="eyebrow">'+(e.type==="match"?"Match":"Entraînement")+'</div><h2>'+esc(e.title)+'</h2></div>'+(e.type==="match"&&e.published?'<span class="status published">Publié</span>':"")+'</div><div class="meta" style="color:var(--muted)"><span>📅 '+fmt(e.date)+"</span><span>🕘 "+esc(e.meeting)+"</span><span>📍 "+esc(e.place)+'</span></div><p class="help">'+esc(e.description)+'</p><div class="block"><h3>Ma réponse</h3>'+(locked?'<p class="locked">'+m+'</p>':'<div class="answer-actions" style="max-width:360px"><button class=\"secondary '+(r.status==="present"?"selected":"")+'" data-answer="present" data-id="'+e.id+'">✓ Présent</button><button class=\"secondary danger '+(r.status==="absent"?"selected":"")+'" data-answer="absent" data-id="'+e.id+'">× Absent</button></div>')+(r.reason?'<p class="help">Motif transmis : '+esc(r.reason)+"</p>":"")+"</div>"+group(e)+"</section>"}
function counts(e){return people(e).reduce((x,p)=>{x[resp(e,p.id).status]++;return x},{present:0,absent:0,pending:0})}
function coachEvent(e){if(!e)return '<div class="empty">Sélectionne ou crée un événement.</div>';let c=counts(e),list=people(e).map(p=>{let r=resp(e,p.id),on=e.selected.includes(p.id),abs=r.status==="absent";return '<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.position||"")+(r.reason?" · "+esc(r.reason):"")+'</span></span>'+tag(r)+(e.type==="match"?'<button class=\"toggle '+(on?"on":"")+'" data-select="'+p.id+'" '+(abs?'disabled title="Joueur absent"':"")+">"+(on?"✓":"+")+"</button>":"")+"</div>"}).join(""),btn=e.type==="match"?'<button class="primary" data-act="publish">'+(e.published?"Mettre à jour le groupe":"Publier le groupe officiel")+'</button><button class="secondary" data-act="unpublish">'+(e.published?"Retirer la publication":"Préparer sans publier")+'</button>':'<button class="primary" data-act="close">Clôturer les réponses</button>';return '<section class="card detail"><div class="title"><div><div class="eyebrow">'+(e.type==="match"?"Match à gérer":"Entraînement à gérer")+'</div><h2>'+esc(e.title)+'</h2></div>'+(e.type==="match"?(e.published?'<span class="status published">Publié</span>':'<span class="status pending-status">Non publié</span>'):"")+'</div><div class="meta" style="color:var(--muted)"><span>📅 '+fmt(e.date)+"</span><span>🕘 "+esc(e.meeting)+'</span></div><div class="block"><h3>'+ (e.type==="match"?"Disponibilités et sélection":"Réponses des joueurs")+'</h3>'+(e.type==="match"?'<p class="feedback">'+e.selected.length+" joueur(s) sélectionné(s)</p>":"")+'<div class="people">'+(list||'<p class="help">Aucun joueur approuvé pour le moment.</p>')+"</div></div><div class=\"actions\">"+btn+"</div><p class=\"help\">"+c.present+" présent(s) · "+c.absent+" absent(s) · "+c.pending+" sans réponse</p></section>"}
function coachScreen(){let e=ev(),c=e?counts(e):{present:0,absent:0,pending:0};return '<div class="head"><div><h2>Espace coach</h2><p>Disponibilités, sélection et publication en direct.</p></div></div><div class="tabs">'+S.events.map(x=>'<button data-event="'+x.id+'" class="'+(x.id===e?.id?"active":"")+'">'+(x.type==="match"?"⚽":"🏃")+" "+esc(x.title)+"</button>").join("")+'</div><div class="actions" style="margin-top:.75rem"><button class="primary" data-act="create" data-type="match">+ Ajouter un match</button><button class="secondary" data-act="create" data-type="training">+ Ajouter un entraînement</button></div><div class="grid coach-grid" style="margin-top:1rem"><section>'+coachEvent(e)+'</section><aside><section class="card pad"><div class="eyebrow">Réponses en direct</div><div class="metrics" style="margin-top:.8rem"><div class="metric"><b style="color:var(--green)">'+c.present+'</b><span>Présents</span></div><div class="metric"><b style="color:var(--red)">'+c.absent+'</b><span>Absents</span></div><div class="metric"><b style="color:var(--amber)">'+c.pending+'</b><span>Sans réponse</span></div></div><p class="help">'+(e?.type==="match"?(e.published?"Le groupe officiel est visible par les joueurs.":"La liste reste invisible aux joueurs tant que tu ne la publies pas."):"Chaque joueur répond pour cette séance.")+"</p></section></aside></div>"}
function adminScreen(){let pend=S.members.filter(p=>p.status==="pending"),ok=S.members.filter(p=>p.status==="approved"&&p.active!==false);return '<div class="head"><div><h2>Administration</h2><p>Inscriptions, rôles et données de l’équipe.</p></div></div><div class="admin-grid"><section class="card detail"><div class="eyebrow">Demandes d’inscription</div><h2 style="margin:.2rem 0">À valider</h2><div class="people block">'+(pend.map(p=>'<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.identifier||"")+" · "+esc(p.position||"")+" · "+esc(p.phone||"sans téléphone")+'</span></span><span class="mini"><button class="primary" data-approve="'+p.id+'">Valider</button><button class="secondary danger" data-reject="'+p.id+'">Refuser</button></span></div>').join("")||'<p class="help">Aucune demande en attente.</p>')+'</div></section><section class="card detail"><div class="eyebrow">Membres</div><h2 style="margin:.2rem 0">Rôles approuvés</h2><div class="people block">'+(ok.map(p=>'<div class="person"><span class="avatar">'+ini(p)+'</span><span class="person-main"><b>'+esc(nm(p))+'</b><span>'+esc(p.identifier||"")+" · "+esc(p.position||"")+'</span></span><select class="admin-role" data-role="'+p.id+'" '+(p.id===S.user.uid?'disabled title="Ton propre rôle ne peut pas être modifié ici"':"")+">"+["joueur","coach","admin"].map(r=>'<option value="'+r+'" '+(p.role===r?"selected":"")+">"+r[0].toUpperCase()+r.slice(1)+"</option>").join("")+"</select></div>").join("")||'<p class="help">Aucun membre approuvé.</p>')+'</div></section></div>'+(!S.events.length?'<section class="card pad" style="margin-top:1rem"><div class="eyebrow">Données de démonstration</div><h2 style="margin:.25rem 0;font-size:1.04rem">Démarrer le test</h2><p class="help">Crée une seule fois les matchs et entraînements de démonstration dans Firestore.</p><div class="actions"><button class="primary" data-act="seed">Initialiser les données de test</button></div></section>':"")}
function profile(){return '<button class="text" data-nav="accueil">← Retour</button><div class="head"><div><h2>Mon profil</h2><p>Les informations utiles, rien de plus.</p></div></div><section class="card detail"><div class="person"><span class="avatar" style="width:3rem;height:3rem;font-size:.9rem">'+ini(S.me)+'</span><span class="person-main"><b style="font-size:1.05rem">'+esc(nm(S.me))+'</b><span>'+esc(S.me.position||"")+'</span></span></div><div class="profile"><div class="field"><span>Identifiant</span><b>'+esc(S.me.identifier||"")+'</b></div><div class="field"><span>Téléphone</span><b>'+esc(S.me.phone||"Non renseigné")+'</b></div><div class="field"><span>Rôle</span><b>'+esc(S.me.role||"joueur")+'</b></div><div class="field"><span>Accès</span><b>Compte validé</b></div></div><div class="actions"><button class="secondary danger" id="logout">Déconnexion</button></div></section>'}
function render(){let ready=S.me?.status==="approved"&&S.me?.active!==false;account.hidden=!ready;bar.innerHTML=S.user?'<b>CONNECTÉ</b> — données synchronisées en temps réel':'<b>PASS D</b> — connexion sécurisée de l’équipe';subtitle.textContent=!ready?"L’essentiel de l’équipe, sans détour.":admin()?"Gérer l’accès de l’équipe, sans quitter l’application.":coach()?"Préparer le groupe et suivre les réponses.":"L’essentiel de l’équipe, sans détour.";if(!S.user)app.innerHTML=authScreen();else if(!S.me)app.innerHTML='<div class="loading">Chargement du compte…</div>';else if(!ready)app.innerHTML=waiting();else if(S.profile||S.view==="profil")app.innerHTML=profile();else if(S.view.startsWith("event:")){let e=S.events.find(x=>x.id===S.view.slice(6));app.innerHTML=e?playerEvent(e):'<div class="empty">Événement introuvable.</div>'}else if(admin()&&S.view==="admin")app.innerHTML=adminScreen();else if(coach()&&S.view==="coach")app.innerHTML=coachScreen();else if(S.view==="agenda")app.innerHTML=agenda();else app.innerHTML=home();let links=admin()?[["admin","⚙","Admin"],["coach","◷","Coach"],["accueil","⌂","Joueur"]]:coach()?[["coach","◷","Coach"],["accueil","⌂","Joueur"],["profil","◉","Profil"]]:[["accueil","⌂","Accueil"],["agenda","◷","Agenda"],["profil","◉","Profil"]];nav.innerHTML=ready?links.map(x=>'<button class="nav '+(S.view===x[0]?"active":"")+'" data-nav="'+x[0]+'"><span>'+x[1]+"</span>"+x[2]+"</button>").join(""):"";bind()}
async function login(f){let value=f.identifier.value.trim(),email=norm(value)==="admin"?"luppi57@gmail.com":mail(value);if(!value||!email){S.error="Saisis un identifiant valide.";return render()}try{S.error="";await signInWithEmailAndPassword(auth,email,f.password.value)}catch(e){err(e)}}
async function signup(f){let id=norm(f.identifier.value),firstName=f.firstName.value.trim(),lastName=f.lastName.value.trim();if(!id||!firstName||!lastName){S.error="Complète les informations demandées.";return render()}if(f.password.value!==f.confirmation.value){S.error="Les deux mots de passe sont différents.";return render()}try{S.error="";let u=await createUserWithEmailAndPassword(auth,mail(id),f.password.value);await setDoc(doc(db,"users",u.user.uid),{firstName,lastName,identifier:id,phone:f.phone.value.trim(),position:f.position.value,role:"joueur",status:"pending",active:false,createdAt:serverTimestamp()})}catch(e){err(e)}}
async function answer(id,status){let e=S.events.find(x=>x.id===id);if(!e||e.closed||(e.type==="match"&&e.published))return;let reason="";if(status==="absent"){let x=prompt("Motif d’absence (facultatif)",resp(e).reason||"");if(x===null)return;reason=x.trim()}try{await setDoc(doc(db,"events",id,"responses",S.user.uid),{status,reason,updatedAt:serverTimestamp()})}catch(e){err(e)}}
async function select(uid){let e=ev();if(!e||resp(e,uid).status==="absent")return;try{let r=doc(db,"events",e.id,"selection",uid);e.selected.includes(uid)?await deleteDoc(r):await setDoc(r,{selectedAt:serverTimestamp(),selectedBy:S.user.uid})}catch(e){err(e)}}
async function publish(){let e=ev();if(!e.selected.length)return alert("Sélectionne au moins un joueur avant de publier le groupe officiel.");if(!confirm("Confirmer : publier le groupe officiel de "+e.selected.length+" joueur(s) ?"))return;try{await updateDoc(doc(db,"events",e.id),{published:true})}catch(e){err(e)}}
async function create(type){let title=prompt(type==="match"?"Titre du match":"Titre de l’entraînement",type==="match"?"CS Veymerange · Adversaire":"Entraînement du jeudi");if(!title?.trim())return;let date=prompt("Date (AAAA-MM-JJ)","2026-09-27");if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert("Date invalide. Utilise le format AAAA-MM-JJ.");let time=prompt("Heure de début (HH:MM)",type==="match"?"10:00":"20:00");if(!time||!/^\d{2}:\d{2}$/.test(time))return alert("Heure invalide. Utilise le format HH:MM.");let place=prompt("Lieu","Stade municipal de Veymerange")||"Lieu à préciser";try{let invited=S.members.filter(p=>p.status==="approved"&&p.active!==false).map(p=>p.id),r=await addDoc(collection(db,"events"),{type,title:title.trim(),date,time,meeting:time,place,description:type==="match"?"Match à organiser.":"Séance collective.",published:false,closed:false,invited,createdAt:serverTimestamp(),createdBy:S.user.uid});S.eventId=r.id}catch(e){err(e)}}
async function approve(uid){try{let b=writeBatch(db);b.update(doc(db,"users",uid),{status:"approved",active:true,role:"joueur"});S.events.forEach(e=>b.update(doc(db,"events",e.id),{invited:arrayUnion(uid)}));await b.commit()}catch(e){err(e)}}
async function seed(){if(S.events.length)return;let invited=S.members.filter(p=>p.status==="approved"&&p.active!==false).map(p=>p.id),data=[["russange","match","CS Veymerange · AS Russange","2026-09-13","10:00","09:15","Stade municipal de Veymerange","Championnat vétérans · Tenue verte et blanche."],["jeudi","training","Entraînement du jeudi","2026-09-10","20:00","19:50","Stade municipal de Veymerange","Séance collective · Préviens si tu ne peux pas venir."],["tressange","match","US Tressange · CS Veymerange","2026-09-20","15:00","14:15","Stade de Tressange","Championnat vétérans · Déplacement."]];try{let b=writeBatch(db);data.forEach(x=>b.set(doc(db,"events",x[0]),{type:x[1],title:x[2],date:x[3],time:x[4],meeting:x[5],place:x[6],description:x[7],invited,published:false,closed:false,createdAt:serverTimestamp(),createdBy:S.user.uid}));await b.commit()}catch(e){err(e)}}
function bind(){let f=document.querySelector("#auth-form");if(f)f.onsubmit=e=>{e.preventDefault();S.mode==="signup"?signup(e.currentTarget):login(e.currentTarget)};document.querySelector("#switch")?.addEventListener("click",()=>{S.mode=S.mode==="login"?"signup":"login";S.error="";render()});document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{S.profile=false;S.view=b.dataset.nav;render()});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.profile=false;S.view="event:"+b.dataset.open;render()});document.querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>{S.eventId=b.dataset.event;render()});document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(b.dataset.id,b.dataset.answer));document.querySelectorAll("[data-select]").forEach(b=>b.onclick=()=>select(b.dataset.select));document.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>approve(b.dataset.approve));document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"users",b.dataset.reject),{status:"rejected",active:false}).catch(err));document.querySelectorAll("[data-role]").forEach(x=>x.onchange=()=>updateDoc(doc(db,"users",x.dataset.role),{role:x.value}).catch(err));document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==="publish")publish();if(a==="unpublish")updateDoc(doc(db,"events",ev().id),{published:false}).catch(err);if(a==="close")updateDoc(doc(db,"events",ev().id),{closed:true}).catch(err);if(a==="create")create(b.dataset.type);if(a==="seed")seed()});document.querySelectorAll("#logout").forEach(b=>b.onclick=()=>signOut(auth))}
const baseRender=render;
function primaryView(){return admin()?"admin":coach()?"coach":"accueil"}
function viewLinks(){return admin()?[["admin","⚙","Admin"],["coach","◷","Coach"],["accueil","⌂","Joueur"],["profil","◉","Profil"]]:coach()?[["coach","◷","Coach"],["accueil","⌂","Joueur"],["profil","◉","Profil"]]:[["accueil","⌂","Joueur"],["agenda","◷","Agenda"],["profil","◉","Profil"]]}
function decorateView(){let ready=S.me?.status==="approved"&&S.me?.active!==false;if(!ready){if(!S.user&&S.mode==="login"){let hint=document.querySelector(".form-card .help"),label=document.querySelector(".form-card .control");if(hint)hint.textContent="Utilise ton identifiant et ton mot de passe.";if(label&&label.firstChild)label.firstChild.nodeValue="Identifiant"}return}nav.innerHTML=viewLinks().map(x=>'<button class="nav '+(S.view===x[0]?"active":"")+'" data-nav="'+x[0]+'"><span>'+x[1]+"</span>"+x[2]+"</button>").join("");if(admin()&&S.view==="admin"){let pending=S.members.filter(p=>p.status==="pending").length,heading=document.querySelector(".admin-grid section:first-child h2");if(heading&&!document.querySelector("#pending-count")){heading.insertAdjacentHTML("afterend",'<p class="feedback" id="pending-count">'+pending+" demande(s) d’inscription en attente</p>")}}}
render=function(){let uid=S.user?.uid||null;if(S.renderedUid!==uid){S.renderedUid=uid;S.initialFor=null}let ready=S.me?.status==="approved"&&S.me?.active!==false;if(ready&&S.initialFor!==uid){S.view=primaryView();S.profile=false;S.initialFor=uid}baseRender();decorateView()}
document.addEventListener("click",event=>{let button=event.target.closest("button");if(!button)return;if(button.matches("[data-open]")){S.backView=S.view;S.profile=false;S.view="event:"+button.dataset.open;event.preventDefault();event.stopImmediatePropagation();render();return}if(button.matches("[data-nav]")){let isBack=button.classList.contains("text")&&button.textContent.trim().startsWith("←");if(isBack){S.profile=false;S.view=S.backView||primaryView()}else{if(button.dataset.nav==="profil")S.backView=S.view;S.profile=false;S.view=button.dataset.nav}event.preventDefault();event.stopImmediatePropagation();render()}},true);
account.onclick=()=>{S.backView=S.view;S.profile=false;S.view="profil";render()};setPersistence(auth,browserLocalPersistence).catch(err);onAuthStateChanged(auth,u=>{clearData();S.profileStop?.();S.profileStop=null;S.user=u;S.me=null;S.profile=false;S.view="accueil";S.error="";if(!u)return render();S.profileStop=onSnapshot(doc(db,"users",u.uid),q=>{S.me=q.exists()?{id:q.id,...q.data()}:null;if(S.me?.status==="approved"&&S.me.active!==false&&S.dataStops.length===0)realtime();render()},err);render()});
</script>
